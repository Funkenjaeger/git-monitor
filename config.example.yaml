# git-monitor configuration — copy to config.yaml and edit for your setup.
#
# Edit in the browser at /config, or by hand here. Changes take effect on the
# next scan. Each target is scanned by piping scan.py to that host's Python over
# SSH (or run locally for `ssh: local`). A host that is unreachable is flagged
# offline and keeps its last snapshot.

scan_interval_minutes: 30      # background rescan cadence
since_days: 365                # heatmap window
top_n: 12                      # projects shown in the "Recent projects" list

# Days a machine's last SUCCESSFUL scan may age before its card is labelled
# STALE and it is counted in `stale_machines`. Default 3.
#
# An unreachable host keeps its last snapshot, so its repos keep being drawn as
# though they had just been observed -- and `offline_machines` cannot cover
# that, because a machine outside its expected_online window is deliberately
# not counted there at all. Three days: long enough that a weekend, a holiday
# Monday or a trip passes in silence, short enough that a fortnight cannot.
# (A desktop spent about two weeks off the wire in Aug 2026 with nothing said.)
# Unlike offline, this is measured against the clock alone -- an off-hours
# machine with week-old data is still stale, and says so.
stale_after_days: 3

# Count only YOUR commits in the heatmap (case-insensitive patterns matched
# against "Name <email>"). Omit to count all authors. List every name/email
# you commit under — check with: git log --all --format='%an <%ae>' | sort -u
authors:
  - your-name
  - you@example.com

# Declared precious paths -- alarmed on if git is IGNORING them (not merely
# leaving them untracked). A pattern with no "/" matches a filename at any
# depth (like a slash-less .gitignore rule); one with a "/" is anchored to
# the repo root. This is a declared list, not a heuristic, on purpose: a
# regenerable __pycache__ and an irreplaceable OAuth token both look like
# "ignored" to git, and only you know which is which. Override per-target
# below if a machine needs its own list instead of (or in addition to) this
# global one.
precious_patterns:
  - credentials.json
  - token.json
  - "*.env"
  - secrets/*

# Being gitignored is only half the question -- the other half is whether
# anything ELSE holds a copy. Declare per target (below) which paths some other
# tool backs up, and a precious file is classified:
#
#   covered   under a declared path            muted chip, informational
#   orphaned  target declares coverage, file   ALARM: only copy is on that disk
#             falls outside all of it
#   unknown   target declares no coverage      warn -- honest, not alarming
#
# Omitting `precious_coverage` for a target means "unknown". An EMPTY list is a
# real declaration -- "nothing on this machine is backed up" -- and yields
# orphaned, which is what you want for a laptop or a Pi with no backup.

# SSH defaults applied to every remote target (override per-target if needed).
remote_python: python3         # interpreter name on the remote host
connect_timeout: 8             # seconds before a host is treated as offline
timeout: 120                   # seconds for the whole scan of one host
ssh_identity: /data/id_ed25519
ssh_options:
  - UserKnownHostsFile=/data/known_hosts

# remote_script: piped | installed   (default: piped; override per-target)
#
# 'piped' is the normal path: scan.py's own bytes are sent over stdin
# (`ssh host python - <b64config> < scan.py`), so nothing needs to be
# installed on the remote. Set `remote_script: installed` for a host that is
# fronted by an SSH forced-command wrapper (e.g. Windows OpenSSH's
# `ForceCommand`, or any setup where the remote always execs its OWN
# installed copy of scan.py regardless of what the client sends). Such a
# wrapper never reads stdin, and piping scan.py's bytes into a process that
# never drains stdin fills the OS pipe buffer and hangs the whole ssh session
# until `timeout` -- indistinguishable from a dead host except for the
# suspiciously round wait. `installed` sends no stdin at all. Whatever
# scan.py the remote's wrapper execs must be kept in sync with this repo's
# scan.py by hand (there is no push-the-script path for this host anymore).

# Timezone for expected_online windows below. Set it here once and every target
# inherits it; override per target for a machine in another zone. There is NO
# default: the collector container's own clock is UTC, so guessing would shift
# every window by the UTC offset and produce a feature that looks like it works.
timezone: America/New_York

# expected_online: when a target is EXPECTED to be reachable.
#
# A machine that is deliberately powered off overnight is not a fault, but
# nothing in the scanner knew that: the 2-consecutive-failure debounce
# (OFFLINE_AFTER_FAILURES in storage.py) guards against a BLIP, and an
# eight-hour absence trips it on the second scan like any real outage. A
# desktop that is off every night therefore reported OFFLINE every night --
# permanently red, and so worth nothing.
#
# Outside its window, a target that fails to answer is not debounced, not
# counted in offline_machines, and not reported as a failed scan; the dashboard
# shows it as "off-hours" rather than green or red. The scan is still
# attempted, so a machine that happens to be up at 02:00 is still picked up.
#
# The accepted trade: a genuinely dead machine goes unreported until its window
# opens. Declare a window only where that is the right trade.
#
#   expected_online: "07:00-23:00"          # shorthand: hours only, every day
#
#   expected_online:                        # full form
#     hours: "07:00-23:00"                  # end EXCLUSIVE; may cross midnight
#     days: [mon, tue, wed, thu, fri]       # optional; default every day
#     timezone: Europe/Berlin               # optional; defaults to the above
#
# A window that will not parse is IGNORED (everything alerts exactly as it
# would with no window at all) and the machine card says so -- but a save
# through /config refuses it outright, which is the moment someone is looking.
# Omit expected_online entirely for anything that is meant to be up 24/7.

targets:
  # The collector host itself — scanned locally, no SSH. Point roots at wherever
  # your repos live; use `bare: true` for a directory of bare repos.
  - name: homelab
    ssh: local
    roots:
      - { path: /mnt/git, depth: 2, bare: true }
      - { path: /home/user, depth: 2 }
    # Paths some other tool holds a copy of. Write them as the SCAN sees them:
    # for a local target that means container paths, which need not match the
    # backup tool's own view of the same directory (a Duplicati source of
    # /source/home/user/projects is /home/user/projects here).
    precious_coverage:
      - { path: /home/user/projects, by: 'duplicati "misc" job' }
      - { path: /mnt/git, by: 'duplicati "misc" job' }

  # A Windows machine with native OpenSSH Server. Note remote_python: python
  # (Windows has no `python3`), and Windows-style paths.
  - name: desktop
    ssh: user@192.168.1.20
    remote_python: python
    roots:
      - { path: C:/projects, depth: 2 }
    # Declared empty, not omitted: this machine has no backup, so anything
    # precious here really is orphaned. Pushing to GitHub does not count --
    # a gitignored file is precisely what a push cannot carry.
    precious_coverage: []
    # This one is a workstation, not a server: it is off overnight by design,
    # so an unanswered scan at 02:00 is expected rather than alarming.
    expected_online: "07:00-23:00"
    # extra:   [ "D:/oneoff/some-repo" ]     # explicit repos outside the roots
    # exclude: [ "C:/projects/huge-vendored" ]
    # If this host's sshd is set up with a forced command that always execs an
    # installed scan.py (see `remote_script` above), uncomment:
    # remote_script: installed

  # A Linux machine.
  - name: linux-pc
    ssh: user@192.168.1.40
    remote_python: python3
    roots:
      - { path: /home/user, depth: 2 }

  # A host reached by a name that only resolves inside the container: map it to
  # a fixed IP via `extra_hosts` in compose.yaml, then reference the name here.
  - name: pi
    ssh: root@myhost.lan
    remote_python: python3
    roots:
      - { path: /, depth: 1 }
    # What this machine is SUPPOSED to be carrying, checked against what the
    # scan actually found. Every other check here reports on a repo that is
    # there; a repo that drops out of scope (a moved path, a `depth` one level
    # too shallow) produces no rows at all, which is also what a machine with
    # nothing to report looks like. Declared, because "we saw it yesterday"
    # cannot catch a root that was wrong from the day it was written.
    # Names are repo directory basenames, matched case-insensitively. Omit the
    # key to declare nothing; an unreachable machine never alarms here, since
    # being down already explains the absence.
    expected_repos:
      - some-repo
      - another-repo
